# Two services on one private Docker network:
#   api -> ticket-api image (built from ./app, pushed to Amazon ECR)
#   db  -> official MySQL 8.0 image with a persistent volume
# Only the API is published (host port 80); MySQL is reachable only by the API.
services:
  db:
    image: mysql:8.0
    container_name: ticket-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
      MYSQL_DATABASE: ticketing
      MYSQL_USER: ${DB_USER:-ticket_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set in .env}
    # keep memory small enough for a t3.micro
    command: ["--performance-schema=OFF", "--innodb-buffer-pool-size=64M"]
    volumes:
      - db-data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [backend]

  api:
    image: ${API_IMAGE:-ticket-api:local}
    container_name: ticket-api
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_NAME: ticketing
      DB_USER: ${DB_USER:-ticket_app}
      DB_PASSWORD: ${DB_PASSWORD:?set in .env}
    ports:
      - "80:8000"
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]

volumes:
  db-data:

networks:
  backend:
